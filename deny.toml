# cargo-deny config: license + advisories + bans.
# Run: cargo deny check
[advisories]
yanked = "warn"
ignore = [
  # ark-crypto-primitives 0.5.0 uses derivative only as a build-time derive
  # macro. RUSTSEC-2024-0388 is a maintenance notice, with no fixed release
  # or reported runtime vulnerability. Keep the reviewed circuit dependency
  # pinned; migrate only with circuit/key compatibility evidence (2026-10-11).
  "RUSTSEC-2024-0388",
  # No fixed replacement from tun-rs/netlink-packet-core yet.
  "RUSTSEC-2024-0436",
  # proc-macro-error2 (unmaintained): build-time-only proc-macro dep, pulled
  # via getset -> neli -> local-ip-address -> headscale-cli. Not in the runtime
  # binary; no fixed upstream yet. Revisit if neli/getset drop it.
  "RUSTSEC-2026-0173",
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "WTFPL",
]
confidence-threshold = 0.8

# Unmodified MPL dependencies of the browser parser and persistent state map.
# Ship licenses/MPL-dependencies.md and licenses/MPL-2.0.txt with binaries;
# exceptions stay limited to the exact reviewed package versions.
exceptions = [
  { name = "cssparser", version = "=0.36.0", allow = ["MPL-2.0"] },
  { name = "cssparser-macros", version = "=0.6.1", allow = ["MPL-2.0"] },
  { name = "dtoa-short", version = "=0.3.5", allow = ["MPL-2.0"] },
  { name = "selectors", version = "=0.37.0", allow = ["MPL-2.0"] },
  { name = "imbl", version = "=7.0.2", allow = ["MPL-2.0"] },
  { name = "imbl-sized-chunks", version = "=0.2.0", allow = ["MPL-2.0"] },
]

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
