# cargo-deny config: license + advisories + bans.
# Run: cargo deny check
[advisories]
yanked = "warn"
ignore = [
  # ark-crypto-primitives 0.5.0 uses derivative only as a build-time derive
  # macro. RUSTSEC-2024-0388 is a maintenance notice, with no fixed release
  # or reported runtime vulnerability. Keep the reviewed circuit dependency
  # pinned; migrate only with circuit/key compatibility evidence (2026-10-11).
  "RUSTSEC-2024-0388",
  # No fixed replacement from tun-rs/netlink-packet-core yet.
  "RUSTSEC-2024-0436",
  # proc-macro-error2 (unmaintained): build-time-only proc-macro dep, pulled
  # via getset -> neli -> local-ip-address -> headscale-cli. Not in the runtime
  # binary; no fixed upstream yet. Revisit if neli/getset drop it.
  "RUSTSEC-2026-0173",
]

[licenses]
allow = [
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "WTFPL",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
