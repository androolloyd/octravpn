[package]
name = "octra-private-payments-experimental"
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
publish = false

[workspace]

[dependencies]
anyhow = "=1.0.103"
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"
ark-r1cs-std = "=0.5.0"
ark-relations = "=0.5.1"
aws-lc-rs = { version = "=1.18.1", default-features = false, features = ["aws-lc-sys"] }
base64 = "=0.22.1"
bs58 = "=0.5.1"
ed25519-dalek = "=2.2.0"
light-poseidon = "=0.4.0"
octra-hfhe = { path = "../../crates/octra-hfhe" }
rand = "=0.8.6"
sha2 = "=0.10.9"
serde_json = "=1.0.149"
subtle = "=2.6.1"
tracing = "=0.1.44"
x25519-dalek = { version = "=2.0.1", features = ["static_secrets"] }
zeroize = { version = "=1.8.2", features = ["derive"] }

[dev-dependencies]
hex = "=0.4.3"
num-bigint = "0.4"
octra-node-protocol = { path = "../../crates/octra-node-protocol" }
octra-node-runtime = { path = "../../crates/octra-node-runtime" }

[lints.rust]
unsafe_code = "forbid"
