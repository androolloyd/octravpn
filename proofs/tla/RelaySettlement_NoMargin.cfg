\* NEGATIVE control: zero margins (Kc = Kr = 0) collapse the I3 quiet zone.
\* TLC MUST report a QuietZone violation here -- this is what the code's
\* resolved_*_margin_epochs().clamp(1, ..) lower bound of 1 prevents. NoDoubleSettle
\* still holds (the on-chain mutex does not depend on margins), demonstrating the
\* two are independent guarantees.
SPECIFICATION Spec
CONSTANTS
    Deposit    = 10
    D          = 3
    SweepGrace = 2
    Kc         = 0
    Kr         = 0
    Ks         = 0
    MaxEpoch   = 8
INVARIANTS
    NoDoubleSettle
    DrainAtMostOnce
    QuietZone
