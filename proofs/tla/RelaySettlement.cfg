SPECIFICATION Spec

\* Small but complete: MaxEpoch spans the whole lifecycle so every path is
\* exercised -- claim window (epoch < D = 3), the quiet zone, the refund window
\* (epoch >= D), and the sweep window (epoch >= D + SweepGrace = 5). Positive
\* margins Kc = Kr = Ks = 1 give a real (non-empty) quiet zone. The state space
\* is small enough for exhaustive checking in a second.
CONSTANTS
    Deposit    = 10
    D          = 3
    SweepGrace = 2
    Kc         = 1
    Kr         = 1
    Ks         = 1
    MaxEpoch   = 8

INVARIANTS
    TypeOK
    NoDoubleSettle
    DrainAtMostOnce
    Conservation
    OnChainWindowsXOR
    QuietZone
