[package]
name = "octra-node-runtime"
version.workspace = true
edition.workspace = true
license = "(MIT OR Apache-2.0) AND BSD-3-Clause"
rust-version.workspace = true
description = "Native execution services for the Octra Rust node."
publish = false

[dependencies]
ed25519-dalek.workspace = true
async-trait.workspace = true
futures.workspace = true
octra-browser = { path = "../octra-browser" }
octra-node-protocol = { path = "../octra-node-protocol" }
octra-exex = { path = "../octra-exex" }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio.workspace = true
octra-hfhe = { path = "../octra-hfhe" }
num-bigint = "0.4"
num-traits.workspace = true
imbl = "=7.0.2"
octra_circle_wasm_host = { path = "../../vendor/octra-circle-wasm-host", features = ["rust-host"] }
octra-lmdb = { path = "../../vendor/octra-lmdb" }
base64.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sha3 = "0.10"
hex.workspace = true
thiserror.workspace = true
zeroize.workspace = true
tempfile.workspace = true
ark-bn254 = "=0.5.0"
ark-ec = "=0.5.0"
ark-ff = "=0.5.0"
ark-groth16 = "=0.5.0"

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[lints]
workspace = true

[features]
test-helpers = []
