[package]
name = "octra-node"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Canonical service coordination for the Rust Octra node."

[dependencies]
octra-node-runtime = { path = "../octra-node-runtime" }
octra-node-protocol = { path = "../octra-node-protocol" }
octra-browser = { path = "../octra-browser" }
octra-exex = { path = "../octra-exex" }
octra-hfhe = { path = "../octra-hfhe" }
octravpn-node = { path = "../octravpn-node" }
octravpn-core = { path = "../octravpn-core" }
anyhow.workspace = true
base64.workspace = true
num-bigint = "0.4"
async-trait.workspace = true
axum.workspace = true
hex.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
clap.workspace = true
rand.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
zeroize.workspace = true
reqwest.workspace = true
futures.workspace = true
h2 = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "tls12"] }
tempfile.workspace = true
tower = { version = "0.5", features = ["util"] }
ed25519-dalek.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "process"] }

[dev-dependencies]
boringtun.workspace = true
rcgen = "0.13"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }

[lints]
workspace = true

[features]
test-helpers = ["octra-node-runtime/test-helpers"]
