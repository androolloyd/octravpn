name: octra release canary

# octra-labs ships mandatory, epoch-gated node releases roughly weekly, and
# our Rust node implements exactly one upstream commit — `commit` in
# docs/rust-node/candidate.json. This job answers one question every day:
# is the release devnet is being told to run the commit we implement?
#
# It fetches the SIGNED release marker at
# https://releases.octra.network/v1/devnet/latest.json, verifies it the way
# the upstream operator tooling does (lite_node controls/lib/release.py —
# ed25519 over the canonical field array, anti-rollback), and compares its
# `public_commit` with our pin (scripts/octra-release-canary.sh).
#
# Behaviour:
#   - In sync: summary only. An open drift issue is closed.
#   - Drift: ONE open issue, labelled `release-canary`, is created or edited
#     in place — the upstream commits between our pin and the release, the
#     marker's action and deadline, and the adoption checklist. It gets a
#     comment only when upstream moves again, not once a day. The job stays
#     green: drift is a to-do, and a detector that is always red tells
#     nobody anything (this one was, 22 runs of 31, before this rewrite).
#   - Blind (origin unreachable, bad signature, rollback): the job fails.
#     That is the only red outcome, so red means "look now".
#
# Nothing is committed back to the repository; the issue and the run
# summary are the record. Adopting an upstream commit — updating
# candidate.json — is what clears the drift.

on:
  schedule:
    - cron: "47 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: compare the signed devnet release with our pin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch, verify and compare the signed release marker
        id: canary
        run: |
          set -u
          set +e
          ./scripts/octra-release-canary.sh --marker-out /tmp/marker.json
          rc=$?
          set -e
          if [ "$rc" -ne 0 ] && [ "$rc" -ne 10 ]; then
            echo "::error::the release marker could not be fetched or did not verify — the canary is blind. This is not an 'in sync' result."
            exit 1
          fi

      - name: Workflow summary
        run: |
          {
            echo "# octra release canary — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| outcome | \`${{ steps.canary.outputs.outcome }}\` |"
            echo "| devnet release | \`${{ steps.canary.outputs.public_commit }}\` (sequence ${{ steps.canary.outputs.sequence }}) |"
            echo "| our node implements | \`${{ steps.canary.outputs.pin_commit }}\` |"
            echo "| action / notice | \`${{ steps.canary.outputs.action }}\` / \`${{ steps.canary.outputs.notice_code }}\` |"
            echo "| marker window | ${{ steps.canary.outputs.issued_at }} → ${{ steps.canary.outputs.expires_at }} (fresh: ${{ steps.canary.outputs.marker_fresh }}) |"
            echo "| consensus profile / rules | ${{ steps.canary.outputs.consensus_profile }} / \`${{ steps.canary.outputs.consensus_rules_id }}\` |"
            echo "| runtime profile hash | \`${{ steps.canary.outputs.runtime_profile_hash }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Track drift in one issue
        uses: actions/github-script@v7
        env:
          OUTCOME: ${{ steps.canary.outputs.outcome }}
          SEQUENCE: ${{ steps.canary.outputs.sequence }}
          ACTION: ${{ steps.canary.outputs.action }}
          NOTICE: ${{ steps.canary.outputs.notice_code }}
          PUBLIC_COMMIT: ${{ steps.canary.outputs.public_commit }}
          PIN_COMMIT: ${{ steps.canary.outputs.pin_commit }}
          ISSUED_AT: ${{ steps.canary.outputs.issued_at }}
          EXPIRES_AT: ${{ steps.canary.outputs.expires_at }}
          MARKER_FRESH: ${{ steps.canary.outputs.marker_fresh }}
          PROFILE: ${{ steps.canary.outputs.consensus_profile }}
          RULES: ${{ steps.canary.outputs.consensus_rules_id }}
          RUNTIME_HASH: ${{ steps.canary.outputs.runtime_profile_hash }}
        with:
          script: |
            const fs = require('fs');
            const env = process.env;
            const { owner, repo } = context.repo;
            const label = 'release-canary';
            const open = (await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: label, per_page: 20,
            })).data.filter(issue => !issue.pull_request);

            if (env.OUTCOME === 'in_sync') {
              for (const issue of open) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: issue.number,
                  body: `Resolved: the signed devnet release (\`${env.PUBLIC_COMMIT}\`, sequence ${env.SEQUENCE}) is the commit recorded in \`docs/rust-node/candidate.json\`.`,
                });
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed' });
              }
              return;
            }

            // What upstream changed between our pin and the release. Read
            // straight from the public repository; a failure here must not
            // hide the drift, so it degrades to a link.
            let range = 'The commit list could not be read; use the compare link.';
            if (env.OUTCOME === 'drift') {
              try {
                const compared = (await github.rest.repos.compareCommitsWithBasehead({
                  owner: 'octra-labs', repo: 'lite_node',
                  basehead: `${env.PIN_COMMIT}...${env.PUBLIC_COMMIT}`, per_page: 100,
                })).data;
                const lines = compared.commits.map(c =>
                  `- \`${c.sha.slice(0, 8)}\` ${c.commit.author.date.slice(0, 10)} ${c.commit.message.split('\n')[0]}`);
                range = compared.status === 'ahead'
                  ? [`Upstream is **${compared.ahead_by} commit(s) ahead** of our pin:`, '', ...lines].join('\n')
                  : `Our pin and the release are **${compared.status}** (ahead ${compared.ahead_by}, behind ${compared.behind_by}) — the pin is not an ancestor of the release.`;
              } catch (error) {
                core.warning(`could not compare upstream commits: ${error.message}`);
              }
            }

            const key = `canary:${env.PIN_COMMIT}:${env.PUBLIC_COMMIT}`;
            const required = env.ACTION === 'required';
            const title = env.OUTCOME === 'unseeded'
              ? 'Release canary: no upstream pin is recorded'
              : `Upstream release drift: devnet runs ${env.PUBLIC_COMMIT.slice(0, 8)} (seq ${env.SEQUENCE}), octra-node implements ${env.PIN_COMMIT.slice(0, 8)}`;
            const body = [
              `<!-- ${key} -->`,
              env.OUTCOME === 'unseeded'
                ? 'The release marker verified, but `docs/rust-node/candidate.json` records no upstream commit, so there is nothing to compare it with.'
                : `The signed devnet release is not the lite_node commit our Rust node implements.${required ? ' The release is marked **required**: validators must be on it, and a node that does not implement its rules stops following the chain.' : ''}`,
              '',
              '| | |',
              '|---|---|',
              `| devnet release | \`${env.PUBLIC_COMMIT}\` (sequence ${env.SEQUENCE}) |`,
              `| octra-node implements | \`${env.PIN_COMMIT}\` |`,
              `| action / notice | \`${env.ACTION}\` / \`${env.NOTICE}\` |`,
              `| marker window | ${env.ISSUED_AT} → ${env.EXPIRES_AT}${env.MARKER_FRESH === 'true' ? '' : ' (expired; upstream has not re-signed)'} |`,
              `| consensus profile / rules | ${env.PROFILE} / \`${env.RULES}\` |`,
              `| runtime profile hash | \`${env.RUNTIME_HASH}\` |`,
              '',
              range,
              '',
              `Compare: https://github.com/octra-labs/lite_node/compare/${env.PIN_COMMIT}...${env.PUBLIC_COMMIT}`,
              '',
              'The profile number and rules id above are compatibility labels and have stayed the same across releases that changed consensus rules; read the commit list, not those two fields, to judge what changed.',
              '',
              'What our node does meanwhile: it keeps serving only while it follows the chain. If a rule it lacks activates, imports stop verifying, the node falls behind its peers, quarantines its root and stops paid admission and the gateway (`503 Node is synchronizing`). It fails closed; it does not catch up without adoption.',
              '',
              'Adoption checklist:',
              '',
              '- [ ] Read the upstream commits above, consensus-visible changes first (quorum and round rules, signing preimage, state roots, activation anchors).',
              '- [ ] Regenerate the native oracles and fixtures from a checkout of the release commit (`scripts/node-port/*-fixtures.py`) and port what changed.',
              '- [ ] `python3 scripts/node-port/check-native-sources.py --upstream <checkout>` and `./scripts/test-all.sh` pass.',
              '- [ ] Update `commit` in `docs/rust-node/candidate.json` (and its source map) and record the checkpoint under `docs/rust-node/checkpoints/`.',
              '',
              'This issue is edited in place while the drift lasts and closes itself when `candidate.json` names the release commit.',
              '',
              '<details><summary>Verified marker</summary>',
              '',
              '```json',
              fs.readFileSync('/tmp/marker.json', 'utf8').trim(),
              '```',
              '',
              '</details>',
              '',
              '(maintained by `.github/workflows/octra-release-canary.yml`)',
            ].join('\n');

            const current = open[0];
            if (!current) {
              const created = await github.rest.issues.create({ owner, repo, title, body, labels: [label] });
              core.info(`opened ${created.data.html_url}`);
              return;
            }
            if ((current.body || '').includes(key)) {
              core.info(`#${current.number} already describes this drift; nothing to do`);
              return;
            }
            // Upstream (or our pin) moved since the issue was last written:
            // rewrite it, and leave one comment so watchers hear about it.
            await github.rest.issues.update({ owner, repo, issue_number: current.number, title, body });
            await github.rest.issues.createComment({
              owner, repo, issue_number: current.number,
              body: `Updated: devnet release is now \`${env.PUBLIC_COMMIT.slice(0, 8)}\` (sequence ${env.SEQUENCE}, \`${env.ACTION}\`); our pin is \`${env.PIN_COMMIT.slice(0, 8)}\`.`,
            });
            // Older duplicates would split the checklist; fold them in.
            for (const stale of open.slice(1)) {
              await github.rest.issues.update({
                owner, repo, issue_number: stale.number, state: 'closed', state_reason: 'not_planned',
              });
            }
