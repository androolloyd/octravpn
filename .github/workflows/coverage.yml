name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tarpaulin:
    name: cargo tarpaulin (release)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: c9011f1f4dfeee3c7c726feb4b4cd337477f866a, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 570fa5a60c8ed792b643a301b5e91d3b668ba614, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      - name: Run release coverage
        run: ./scripts/coverage.sh
