name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tarpaulin:
    name: cargo tarpaulin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: 07a11f6f5d1d0b1f46145bba19616570f85acc2c, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: e1d719104fc77edb0001932e28c859f81ec7dc78, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      - name: Run coverage
        run: ./scripts/coverage.sh
