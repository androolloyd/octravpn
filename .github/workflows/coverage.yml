name: Coverage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  tarpaulin:
    name: cargo tarpaulin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 7b6b71b245ceff25f27a400588d78dd28e6e340f, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      - name: Run coverage
        run: ./scripts/coverage.sh
