name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      # Format every workspace member with the pinned toolchain. `--all`
      # also traverses sibling/path dependencies, including byte-pinned
      # native sources. Verify those against their provenance instead.
      - uses: ./octra/.github/actions/setup-rust
        with:
          components: rustfmt
          cache: "false"
      - run: cargo fmt -- --check
      - run: python3 scripts/node-port/check-native-sources.py --vendored-only

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
        with:
          components: clippy
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # publish_unverified lives behind the test-helpers feature; the
      # mesh tests + bench require it. Run a second clippy pass with
      # the feature on so the test cfg gets lint-coverage too.
      - run: cargo clippy --locked --workspace --tests --features test-helpers -- -D warnings

  test:
    name: cargo test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      - run: cargo test --locked --workspace --all-targets --all-features
      # Extra explicit run with the mesh test-helpers feature so a
      # change that builds under --all-features but breaks the
      # feature-isolated build fails CI here. Matches scripts/test-all.sh.
      - run: cargo test --locked -p octravpn-mesh --all-targets --features test-helpers

  bench-regression:
    # Compares a fresh octravpn-core bench run against the committed
    # snapshot at bench-snapshots/core.json. Lives in its own job so a
    # slow / noisy bench run doesn't gate the cargo lane.
    #
    # Advisory: GH-hosted ubuntu-latest runners exhibit ~20-30% bench-to-
    # bench wall-clock variance (shared infra, neighbour noise, no perf
    # isolation). Keep the signal visible but don't block PR merges on it;
    # treat it as a smoke alarm — investigate when it fires alongside a
    # plausible code-side perf change, ignore when it fires in isolation.
    name: bench regression gate
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - name: Install jq
        run: sudo apt-get update -y >/dev/null && sudo apt-get install -y jq >/dev/null
      - name: Compare against bench-snapshots/core.json
        # Short measurement time so the runner doesn't sit for ~30 min.
        # The 20% threshold floor is wide enough to absorb the noise.
        env:
          BENCH_REGRESSION_QUICK: "1"
        run: ./scripts/bench-regression.sh

  aml-tests:
    name: AML compile and real VM security tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with:
          repository: octra-labs/amlc
          ref: 3a183bc8892b1795f2e1059848f1f331ce1a3a51
          path: amlc
      - uses: ocaml/setup-ocaml@v3
        with: { ocaml-compiler: 4.14.2 }
      - working-directory: amlc
        run: |
          git apply ../octra/scripts/private-admin/standalone-label-fix.patch
          opam install . --deps-only --yes
          sh scripts/build.sh
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.96.0"
      - working-directory: octra-foundry
        run: cargo build --locked -p octra-cli
      - working-directory: octra
        env:
          AMLC: ${{ github.workspace }}/amlc/_build/install/default/bin/amlc
        run: |
          python3 scripts/private-admin/test-compiler-labels.py --amlc "$AMLC"
          bash scripts/test-aml.sh
          python3 scripts/private-admin/test-deployment-verifier.py
          python3 scripts/private-admin/test-canary-runner.py

  tla:
    name: TLC model check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Download TLA+ tools
        run: |
          curl -L -o /tmp/tla2tools.jar \
            https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          echo "936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88  /tmp/tla2tools.jar" | sha256sum -c -
      - name: Run TLC (v1.1)
        run: |
          cd proofs/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto -deadlock OctraVPN -config OctraVPN.cfg
      - name: Run TLC (v2)
        run: |
          cd proofs/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto -deadlock OctraVPN_V2 -config OctraVPN_V2.cfg
      - name: Run TLC (v4 relay settlement)
        run: |
          cd proofs/tla
          java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto -deadlock RelaySettlement -config RelaySettlement.cfg
      - name: Run TLC (v4 relay quiet-zone negative control - must break at margin 0)
        run: |
          cd proofs/tla
          out=$(java -cp /tmp/tla2tools.jar tlc2.TLC \
            -workers auto -deadlock RelaySettlement -config RelaySettlement_NoMargin.cfg 2>&1 || true)
          echo "$out" | grep -q "Invariant QuietZone is violated" \
            || { echo "FAIL: expected QuietZone violation at zero margin (the margin clamp >= 1 is load-bearing)"; echo "$out" | tail -20; exit 1; }
          echo "OK: zero-margin config breaks QuietZone as expected"

  tamarin:
    name: Tamarin protocol safety
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Tamarin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgmp10 graphviz unzip
          curl -fSL -o /tmp/tamarin.tar.gz https://github.com/tamarin-prover/tamarin-prover/releases/download/1.12.0/tamarin-prover-1.12.0-linux64-ubuntu.tar.gz
          echo "201be06f469e47cff554df6ca93db8366fc2c69d70c61fcbd1370a1074b469c6  /tmp/tamarin.tar.gz" | sha256sum -c -
          mkdir /tmp/tamarin
          tar -xzf /tmp/tamarin.tar.gz -C /tmp/tamarin
          find /tmp/tamarin -type f -name tamarin-prover -exec sudo install -m 755 {} /usr/local/bin/tamarin-prover \;
          curl -fSL -o /tmp/maude.zip https://github.com/maude-lang/Maude/releases/download/Maude3.5.1/Maude-3.5.1-linux-x86_64.zip
          echo "72ed1ca87e3b3d0dfc6ee1436baf154bf04c45ff97d521bec040c5e8dfc8f92c  /tmp/maude.zip" | sha256sum -c -
          sudo mkdir -p /opt/maude-3.5.1
          sudo unzip -q /tmp/maude.zip -d /opt/maude-3.5.1
          sudo chmod 755 /opt/maude-3.5.1/maude
          sudo ln -s /opt/maude-3.5.1/maude /usr/local/bin/maude
          echo "MAUDE_LIB=/opt/maude-3.5.1" >> "$GITHUB_ENV"
          test "$(maude --version)" = '3.5.1'
          tamarin-prover --version
      - name: Verify every required lemma
        run: scripts/run-tamarin.sh

  lean:
    name: Lean build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: lake build
        run: |
          cd proofs/lean && lake build

  kani:
    name: Kani harnesses
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier --version 0.68.0
          cargo kani setup
      - name: Run harnesses
        run: |
          cargo kani --manifest-path proofs/kani/Cargo.toml

  docker-e2e:
    name: docker-compose e2e
    runs-on: ubuntu-latest
    # Now a required gate: the foundry-context build + tailnet
    # happy-path run green end-to-end in CI (default docker driver +
    # tracked stub keys + two-step settle). Was advisory while those
    # were shaking out.
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      # NB: do NOT add docker/setup-buildx-action here. It switches to
      # the `docker-container` buildx driver, whose build store is
      # isolated from the host daemon — so the `octravpn-builder:latest`
      # image that `e2e.sh` builds first becomes invisible to the
      # downstream `FROM octravpn-builder:latest` builds, which then try
      # (and fail) to pull it from Docker Hub. The runner's default
      # docker driver shares the local image store, matching dev boxes.
      - name: Endpoint-registration smoke
        run: cd octra && ./docker/e2e.sh
      - name: Full tailnet happy-path
        run: cd octra && ./docker/e2e-tailnet.sh

  coverage:
    name: cargo tarpaulin (coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      # cargo-tarpaulin's recent releases lock a dependency tree that
      # needs rustc 1.91 (cargo-platform 0.3.3), so `cargo install`
      # fails on the repo's pinned 1.88. Pull a prebuilt binary instead
      # — no compile, no MSRV coupling. coverage.sh's `cargo tarpaulin
      # --version` guard then skips its own install.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      - name: Run coverage
        run: ./scripts/coverage.sh

  bench:
    name: criterion smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - name: Build benches
        run: cargo bench -p octravpn-core --no-run

  audit:
    name: cargo audit + deny
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
        with:
          cache: "false"
      - name: Install audit + deny
        run: |
          cargo install --locked cargo-audit cargo-deny
      - name: cargo audit
        run: cargo audit --deny warnings
      - name: cargo deny check
        run: cargo deny check

  fuzz-build:
    name: cargo fuzz build (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: octra
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: d5feaad7f14d6a381e2327dfd6738cae8df95b31, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 5662f202a8448364cb212a12c0489216c74ab6ca, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
        with:
          toolchain: nightly
      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz
      - name: Check fuzz corpus inventory
        run: ./scripts/check-fuzz-corpus.sh
      - name: Build fuzz targets
        working-directory: octra/fuzz
        run: |
          cargo +nightly fuzz build receipt_decode
          cargo +nightly fuzz build onion_peel
          cargo +nightly fuzz build tx_canonical
