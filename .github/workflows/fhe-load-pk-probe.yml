name: fhe_load_pk daily re-probe

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check classification controls
        run: python3 -m unittest discover -s scripts/probes -p 'test_*.py'
      - name: Read public devnet prerequisites and probe
        run: python3 scripts/probes/fhe_load_pk.py --output fhe-load-pk-devnet.json
      - name: Read mainnet prerequisites separately
        run: python3 scripts/probes/fhe_load_pk.py --rpc https://octra.network/rpc --output fhe-load-pk-mainnet.json
      - name: Retain current observations
        uses: actions/upload-artifact@v4
        with:
          name: fhe-load-pk-observations
          path: fhe-load-pk-*.json
      - name: Workflow summary
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json,pathlib
          print('| Endpoint | Result |\n|---|---|')
          for path in sorted(pathlib.Path('.').glob('fhe-load-pk-*.json')):
              value=json.loads(path.read_text())
              print(f"| {value['rpc_url']} | {value['message']} |")
          print('\nArtifacts contain the current check. A legacy positive response is not deployment qualification.')
          PY
