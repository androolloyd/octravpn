name: VPN Circle application
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/octravpn-circle-registry/**'
      - 'crates/octra-exex/**'
      - 'crates/octra-node-protocol/**'
      - 'crates/octra-node-runtime/**'
      - 'crates/octra-pvac/**'
      - 'crates/octra-hfhe/**'
      - 'vendor/octra-circle-wasm-host/**'
      - 'vendor/octra-pvac/**'
      - 'scripts/circle-apps/**'
      - 'scripts/node-port/**'
      - 'docs/rust-node/**'
      - 'Cargo.lock'
      - '.github/workflows/circle-vpn.yml'
permissions:
  contents: read
jobs:
  circle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: c9011f1f4dfeee3c7c726feb4b4cd337477f866a, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, ref: 570fa5a60c8ed792b643a301b5e91d3b668ba614, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      # The release tests of these packages run in ci.yml's `test` shards
      # (runtime, runtime-circle, crypto, rest) on every pull request. This
      # job used to repeat them under its 30-minute limit and so never once
      # finished — the runtime package alone is ~50 minutes — which also
      # meant the step after it never ran. It keeps what only it checks:
      # Clippy with every feature on, the registry linted for wasm32, and
      # the native host ABI with the unsigned package.
      - name: Circle crates lint with every feature; registry lints for wasm32
        working-directory: octra
        run: |
          cargo clippy --locked -p octra-hfhe -p octra-node-runtime -p octra-pvac -p octra-node-protocol -p octra-exex -p octravpn-circle-registry --all-targets --all-features -- -D warnings
          cargo clippy --locked -p octravpn-circle-registry --target wasm32-unknown-unknown --lib -- -D warnings
      # The inventory also compares each revision recorded as source-equivalent
      # to the pin; the checkouts above hold one commit each.
      - name: Fetch the source-equivalent upstream revisions
        working-directory: octra
        run: |
          python3 -c 'import json; print("\n".join(json.load(open("docs/rust-node/upstream.json")).get("source_equivalent_commits", [])))' |
            while IFS= read -r commit; do
              [ -z "$commit" ] || git -C ../lite-node fetch --quiet --depth 1 origin "$commit"
            done
      - name: Pinned native host ABI and unsigned package
        working-directory: octra
        run: |
          python3 scripts/node-port/inventory.py --upstream ../lite-node --check
          python3 scripts/node-port/check-native-sources.py --upstream ../lite-node-candidate
          python3 scripts/circle-apps/test-registry-native.py --upstream ../lite-node-candidate --commit "$OCTRA_CIRCLE_UPSTREAM_COMMIT" --out out/registry-native.json
          python3 scripts/circle-apps/prepare-registry.py --evidence out/registry-native.json --out out/registry-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-circle-application
          path: |
            octra/out/registry*
            octra/out/hfhe-budget-native.json
