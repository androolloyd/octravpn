name: VPN Circle application
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/octravpn-circle-registry/**'
      - 'crates/octra-exex/**'
      - 'crates/octra-node-protocol/**'
      - 'crates/octra-node-runtime/**'
      - 'crates/octra-pvac/**'
      - 'crates/octra-hfhe/**'
      - 'vendor/octra-circle-wasm-host/**'
      - 'vendor/octra-pvac/**'
      - 'scripts/circle-apps/**'
      - 'scripts/node-port/**'
      - 'docs/rust-node/**'
      - 'Cargo.lock'
      - '.github/workflows/circle-vpn.yml'
permissions:
  contents: read
jobs:
  circle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: octra }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/octra-foundry, ref: 995e51af02155bc7178af629c00a74ab0f8f5816, path: octra-foundry }
      - uses: actions/checkout@v4
        with: { repository: androolloyd/headscale-rs, path: headscale-rs }
      - uses: ./octra/.github/actions/setup-rust
      - uses: ./octra/.github/actions/prepare-native-tests
      - name: Circle application and durable ExEx delivery
        working-directory: octra
        run: |
          cargo test --locked -p octra-hfhe -p octra-node-runtime -p octra-pvac -p octra-node-protocol -p octra-exex -p octravpn-circle-registry --all-features
          cargo clippy --locked -p octra-hfhe -p octra-node-runtime -p octra-pvac -p octra-node-protocol -p octra-exex -p octravpn-circle-registry --all-targets --all-features -- -D warnings
          cargo clippy --locked -p octravpn-circle-registry --target wasm32-unknown-unknown --lib -- -D warnings
      - name: Pinned native host ABI and unsigned package
        working-directory: octra
        run: |
          python3 scripts/node-port/inventory.py --upstream ../lite-node --check
          python3 scripts/node-port/check-native-sources.py --upstream ../lite-node
          python3 scripts/circle-apps/test-registry-native.py --upstream ../lite-node --out out/registry-native.json
          python3 scripts/circle-apps/prepare-registry.py --evidence out/registry-native.json --out out/registry-package
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vpn-circle-application
          path: |
            octra/out/registry*
            octra/out/hfhe-budget-native.json
